<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f8f7" />
    <meta name="description" content="Observatorio de datos de gasóleo C en España." />
    <title>GasEs — datos de gasóleo C</title>
    <script>
        try {
            const savedTheme = localStorage.getItem('gases-theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme =
                savedTheme === 'dark' || savedTheme === 'light'
                    ? savedTheme
                    : systemPrefersDark ? 'dark' : 'light';
            document.querySelector('meta[name="theme-color"]').content =
                document.documentElement.dataset.theme === 'dark' ? '#101b1c' : '#f5f8f7';
        } catch {
            document.documentElement.dataset.theme =
                window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.querySelector('meta[name="theme-color"]').content =
                document.documentElement.dataset.theme === 'dark' ? '#101b1c' : '#f5f8f7';
        }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
